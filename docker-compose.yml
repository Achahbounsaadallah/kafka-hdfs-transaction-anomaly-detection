
services:

  # =================================
  # KAFKA
  # =================================

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka

    ports:
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP NAMENODE
  # =================================

  namenode:
    build:
      context: ./docker/namenode

    image: custom-hadoop-namenode:3.2.1-python3

    container_name: namenode
    hostname: namenode

    ports:
      - "9870:9870"
      - "9000:9000"

    environment:
      CLUSTER_NAME: hadoop-cluster

    env_file:
      - hadoop.env

    volumes:
      - namenode_data:/hadoop/dfs/name

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP DATANODE
  # =================================

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8

    container_name: datanode
    hostname: datanode

    ports:
      - "9864:9864"

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - hadoop.env

    volumes:
      - datanode_data:/hadoop/dfs/data

    depends_on:
      - namenode

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP RESOURCE MANAGER
  # =================================

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8

    container_name: resourcemanager
    hostname: resourcemanager

    ports:
      - "8088:8088"

    env_file:
      - hadoop.env

    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"

    depends_on:
      - namenode
      - datanode

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP NODE MANAGER
  # =================================

  nodemanager:
    build:
      context: ./docker/nodemanager

    image: custom-hadoop-nodemanager:3.2.1-python3

    container_name: nodemanager
    hostname: nodemanager

    ports:
      - "8042:8042"

    env_file:
      - hadoop.env

    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"

    depends_on:
      - namenode
      - datanode
      - resourcemanager

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # AIRFLOW
  # =================================

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    env_file:
      - .env

    image: custom-airflow-kafka-hadoop:1.0

    container_name: airflow
    hostname: airflow

    command: standalone

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"


    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "0"

    depends_on:
      - kafka
      - namenode
      - datanode
      - resourcemanager
      - nodemanager

    networks:
      - bigdata-network

    restart: unless-stopped


# =================================
# VOLUMES
# =================================

volumes:
  kafka_data:
  namenode_data:
  datanode_data:


# =================================
# NETWORK
# =================================

networks:
  bigdata-network:
    driver: bridge
