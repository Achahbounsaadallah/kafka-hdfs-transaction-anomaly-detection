
services:

  # =================================
  # KAFKA
  # =================================

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"
      - "9093:9093"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - bigdata-network


  # =================================
  # HADOOP NAMENODE (CUSTOM + PYTHON)
  # =================================

  namenode:
    build:
      context: ./docker/namenode

    image: custom-hadoop-namenode:3.2.1-python3

    container_name: namenode
    hostname: namenode

    ports:
      - "9870:9870"
      - "9000:9000"

    environment:
      CLUSTER_NAME: hadoop-cluster

    env_file:
      - hadoop.env

    volumes:
      - namenode_data:/hadoop/dfs/name

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP DATANODE
  # =================================

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8

    container_name: datanode
    hostname: datanode

    ports:
      - "9864:9864"

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - hadoop.env

    volumes:
      - datanode_data:/hadoop/dfs/data

    depends_on:
      - namenode

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP RESOURCE MANAGER
  # =================================

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8

    container_name: resourcemanager
    hostname: resourcemanager

    ports:
      - "8088:8088"

    env_file:
      - hadoop.env

    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"

    depends_on:
      - namenode
      - datanode

    networks:
      - bigdata-network

    restart: unless-stopped


  # =================================
  # HADOOP NODE MANAGER (CUSTOM + PYTHON)
  # =================================

  nodemanager:
    build:
      context: ./docker/nodemanager

    image: custom-hadoop-nodemanager:3.2.1-python3

    container_name: nodemanager
    hostname: nodemanager

    ports:
      - "8042:8042"

    env_file:
      - hadoop.env

    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"

    depends_on:
      - namenode
      - datanode
      - resourcemanager

    networks:
      - bigdata-network

    restart: unless-stopped


# =================================
# VOLUMES
# =================================

volumes:
  kafka_data:
  namenode_data:
  datanode_data:


# =================================
# NETWORK
# =================================

networks:
  bigdata-network:
    driver: bridge
